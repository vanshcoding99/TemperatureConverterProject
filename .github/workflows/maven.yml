# Runs the JUnit tests with Maven on every push to main,
# so each Red / Green / Refactor commit gets its own pass or fail result.
name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run JUnit tests with Maven
        run: mvn -B test --file pom.xml

      - name: Write test results to the run summary
        if: always()
        shell: python
        run: |
          import glob, os
          import xml.etree.ElementTree as ET

          rows, passed, failed = [], 0, 0
          for report in sorted(glob.glob("target/surefire-reports/TEST-*.xml")):
              for case in ET.parse(report).getroot().iter("testcase"):
                  problem = case.find("failure")
                  if problem is None:
                      problem = case.find("error")
                  if problem is None:
                      passed += 1
                      rows.append(f"| `{case.get('name')}` | ✅ Passed | |")
                  else:
                      failed += 1
                      message = (problem.get("message") or "").replace("|", "\\|")
                      rows.append(f"| `{case.get('name')}` | ❌ Failed | {message} |")

          lines = ["### JUnit test results", ""]
          if rows:
              lines += ["| Test | Result | Details |", "|---|---|---|", *rows, ""]
              lines.append(f"**{passed + failed} tests run: {passed} passed, {failed} failed**")
          else:
              lines.append("No tests have been written yet.")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("\n".join(lines) + "\n")
